<!DOCTYPE html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>OCBC Circuit Breaker Management Portal</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
		<script>
			// Prevent flash of wrong theme by setting dark mode before page loads
			(function() {
				try {
					if (typeof window !== 'undefined' && typeof localStorage !== 'undefined' && typeof document !== 'undefined') {
						const savedDarkMode = localStorage.getItem('darkMode');
						if (savedDarkMode === 'true') {
							document.documentElement.classList.add('dark');
						} else if (savedDarkMode === null && typeof window.matchMedia !== 'undefined') {
							// If no preference saved, check system preference
							if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
								document.documentElement.classList.add('dark');
							}
						}
					}
				} catch (e) {
					// Silently fail if APIs are not available
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
