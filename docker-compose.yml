version: '3.8'

services:
  f5-control-center:
    build: .
    ports:
      - "8091:3000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=file:./data/prod.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --spider --timeout=5 http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
